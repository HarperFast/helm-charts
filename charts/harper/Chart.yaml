apiVersion: v2
name: harper
description: |
  Deploy a configurable Harper (Harper Pro) cluster on Kubernetes / OpenShift.
  Runs N Harper instances as a StatefulSet with stable network identity,
  per-pod persistent storage, and an automatically wired native (Plexus)
  replication mesh. Every harper-config.yaml option is configurable.
type: application

# Chart version (bump on chart changes).
version: 0.1.0

# Default Harper Pro release deployed by this chart. Override via image.tag.
# Corresponds to the certified image harperfast/harper-pro-openshift.
appVersion: "5.0.26"

home: https://www.harperdb.io
sources:
  - https://github.com/HarperDB/helm-charts
  - https://hub.docker.com/r/harperfast/harper-pro-openshift
  - https://catalog.redhat.com/en/software/containers/harperfast/harper-pro-openshift
  - https://docs.harperdb.io/reference/v5/configuration/options

keywords:
  - harper
  - harperdb
  - database
  - nosql
  - cache
  - openshift

maintainers:
  - name: Harper Support
    email: support@harperdb.io

annotations:
  # artifacthub.io annotations (https://artifacthub.io/docs/topics/annotations/helm/)
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.harperdb.io
    - name: GitHub
      url: https://github.com/HarperDB/helm-charts
    - name: Issues
      url: https://github.com/HarperDB/helm-charts/issues
