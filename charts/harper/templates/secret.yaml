{{- if not .Values.harper.admin.existingSecret }}
{{- /*
  Chart-managed admin Secret. Password precedence:
    1. .Values.harper.admin.password if set
    2. existing in-cluster value (preserved across upgrades)
    3. a newly generated random password
*/ -}}
{{- $secretName := printf "%s-admin" (include "harper.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $pw := "" -}}
{{- if .Values.harper.admin.password -}}
{{-   $pw = .Values.harper.admin.password -}}
{{- else if and $existing $existing.data (index $existing.data "password") -}}
{{-   $pw = (index $existing.data "password" | b64dec) -}}
{{- else -}}
{{-   $pw = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "harper.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ .Values.harper.admin.username | b64enc | quote }}
  password: {{ $pw | b64enc | quote }}
{{- end }}
